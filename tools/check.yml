# Controleert bij elke wijziging of de zorgpaden en de code in orde zijn (zie tools/check.js).
# Het resultaat zie je op GitHub bij de commit of pull request: een groen vinkje of een rood kruisje.
# Klik op het kruisje en daarna op "Details" om te zien wat er mis is.
name: Controle zorgpaden

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Zorgpaden en code controleren
        run: node tools/check.js
