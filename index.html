<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactieve zorgpaden en beslisbomen voor gynaecologische tumoren.">
  <title>Oncoguide Alternative</title>
  <link rel="stylesheet" href="./css/styles.css?v=2026-10-30l">
</head>
<body class="home-page">
  <main class="home-shell">
    <header class="home-header">
      <h1>Gynaecologische zorgpaden</h1>
      <p>Interactieve zorgpaden en beslisbomen voor gynaecologische tumoren</p>
    </header>

    <section class="tumor-overview" aria-labelledby="tumor-overview-title">
      <h2 id="tumor-overview-title" class="visually-hidden">Beschikbare gynaecologische zorgpaden</h2>
      <div id="tumor-grid" class="tumor-grid" aria-live="polite"></div>
      <p id="tumor-error" class="page-message" role="alert" hidden></p>
    </section>
  </main>

  <dialog id="coming-soon-dialog" class="coming-soon-dialog" aria-labelledby="coming-soon-title">
    <div class="dialog-content">
      <h2 id="coming-soon-title">Zorgpad in voorbereiding</h2>
      <p id="coming-soon-text"></p>
      <button id="close-dialog" class="dialog-button" type="button">Sluiten</button>
    </div>
  </dialog>

  <footer class="site-footer" aria-label="Website-informatie">
    <button class="footer-link" type="button" data-content-page="gebruiksvoorwaarden">U bent akkoord met de gebruiksvoorwaarden</button>
    <span aria-hidden="true">|</span>
    <button class="footer-link" type="button" data-content-page="faq">FAQ</button>
    <span aria-hidden="true">|</span>
    <button class="footer-link" type="button" data-content-page="privacy-statement">Privacy</button>
    <span aria-hidden="true">|</span>
    <button class="footer-link" type="button" data-content-page="over">Over deze website</button>
  </footer>

  <div id="content-panel-backdrop" class="content-panel-backdrop" hidden></div>

  <aside
    id="content-panel"
    class="content-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="content-panel-title"
    hidden>
    <header class="content-panel-header">
      <div>
        <h2 id="content-panel-title">Informatie</h2>
        <p id="content-panel-meta" class="content-panel-meta"></p>
      </div>
      <button
        id="content-panel-close"
        class="content-panel-close"
        type="button"
        aria-label="Informatiepaneel sluiten">×</button>
    </header>
    <div id="content-panel-body" class="content-panel-body"></div>
  </aside>

  <!-- Verhoog ?v= bij elke publicatie, zodat browsers de nieuwe versie laden in plaats van een oude uit de cache. -->
  <script src="./js/content-panel.js?v=2026-10-30l"></script>
  <script src="./js/home.js?v=2026-10-30l"></script>
</body>
</html>
