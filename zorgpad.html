<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zorgpad – Gynaecologische zorgpaden</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="zorgpad">
  <main id="zp-main" class="zp-main">
    <div class="zp-toolbar">
      <a id="zp-home" class="zp-btn" href="index.html">← Homepage</a>
      <button id="zp-back" class="zp-btn zp-back" type="button">Terug naar zorgpad</button>
      <span id="zp-tools" class="zp-tools">
        <button id="zp-zout" class="zp-btn zp-zoom" type="button" aria-label="Uitzoomen">&minus;</button>
        <button id="zp-zin" class="zp-btn zp-zoom" type="button" aria-label="Inzoomen">+</button>
      </span>
    </div>
    <div id="zp-stage" class="zp-stage"><svg id="zp-chart" role="group" aria-label="Zorgpad"></svg></div>
    <div id="zp-message" class="zp-message" role="status" aria-live="polite">Laden…</div>
  </main>


  <footer class="site-footer" aria-label="Website-informatie">
    <button class="footer-link" type="button" data-content-page="gebruiksvoorwaarden">Gebruiksvoorwaarden</button>
    <span aria-hidden="true">·</span>
    <button class="footer-link" type="button" data-content-page="faq">FAQ</button>
    <span aria-hidden="true">·</span>
    <button class="footer-link" type="button" data-content-page="privacy-statement">Privacy</button>
    <span aria-hidden="true">·</span>
    <button class="footer-link" type="button" data-content-page="over">Over deze website</button>
  </footer>

  <div id="content-panel-backdrop" class="content-panel-backdrop" hidden></div>

  <aside id="content-panel" class="content-panel" role="dialog" aria-modal="true" aria-labelledby="content-panel-title" hidden>
    <header class="content-panel-header">
      <div>
        <h2 id="content-panel-title">Informatie</h2>
        <p id="content-panel-meta" class="content-panel-meta"></p>
      </div>
      <button id="content-panel-close" class="content-panel-close" type="button" aria-label="Informatiepaneel sluiten">×</button>
    </header>
    <div id="content-panel-body" class="content-panel-body"></div>
  </aside>

  <script src="js/content-panel.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      ContentPanel.init();
    });
  </script>
  <script src="js/state.js"></script>
  <script src="js/graph-state.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/choice-panel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
