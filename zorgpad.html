<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zorgpad – Gynaecologische zorgpaden</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="zorgpad">
  <main id="zp-main" class="zp-main">
    <div class="zp-toolbar">
      <a id="zp-home" class="zp-btn" href="index.html">← Homepage</a>
      <button id="zp-back" class="zp-btn zp-back" type="button">Terug naar overzicht</button>
      <span id="zp-tools" class="zp-tools">
        <button id="zp-zout" class="zp-btn zp-zoom" type="button" aria-label="Uitzoomen">&minus;</button>
        <button id="zp-zin" class="zp-btn zp-zoom" type="button" aria-label="Inzoomen">+</button>
      </span>
    </div>
    <div id="zp-stage" class="zp-stage"><svg id="zp-chart" role="group" aria-label="Zorgpad"></svg></div>
    <div id="zp-message" class="zp-message" role="status" aria-live="polite">Laden…</div>
  </main>

  <script src="js/state.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/choice-panel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
