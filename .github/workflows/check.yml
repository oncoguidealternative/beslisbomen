# Controleert bij elke wijziging of de zorgpaden en de code in orde zijn (zie tools/check.js).
# Het resultaat zie je op GitHub bij de commit of pull request: een groen vinkje of een rood kruisje.
# Klik op het kruisje en daarna op "Details" om te zien wat er mis is.
name: Controle zorgpaden

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Zorgpaden en code controleren
        run: node tools/check.js
      - name: Raster controleren (maten van blokken en afstanden)
        run: node tools/check-raster.js

  tekst:
    # Opent elk zorgpad en elke beslisboom in een echte browser en meldt tekst die niet in een blok past
    # of over een icoon loopt (zie tools/check-tekst.js).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Browser installeren
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Controleren of alle tekst in de blokken past
        run: node tools/check-tekst.js
      - name: Controleren of aanbevelingen niet te veel witruimte hebben
        run: node tools/check-witruimte.js
